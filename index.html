
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TerraVeri Console</title>
<style>
/* layout: app shell — left nav rail (collapses to top tabs on mobile), top bar with animal switcher, content pane swapped by JS */
:root{
  --bg:#0a1710;
  --panel:#102217;
  --panel-2:#0d1c13;
  --panel-3:#152a1d;
  --line:#24382a;
  --ink:#f3eee0;
  --muted:#93a99a;
  --muted-dim:#5f7568;
  --lime:#c8f24e;
  --amber:#e8b566;
  --red:#e0654f;
  --cyan:#7fd8c8;
  --sky:#8fb3e8;
  color-scheme:dark;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Manrope',-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SF Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html{ scrollbar-width:thin; scrollbar-color:var(--panel-3) var(--bg); }
body{ background:var(--bg); color:var(--ink); font-family:var(--font-body); margin:0; scrollbar-width:thin; scrollbar-color:var(--panel-3) var(--bg); }
button,select{ font-family:inherit; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:var(--bg); }
::-webkit-scrollbar-thumb{ background:var(--panel-3); border-radius:8px; border:2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover{ background:var(--line); }
:focus-visible{ outline:2px solid var(--lime); outline-offset:2px; border-radius:4px; }

.app{ display:flex; min-height:100%; position:relative; }

.rail{ flex:0 0 216px; border-right:1px solid var(--line); padding:22px 14px; display:flex; flex-direction:column; gap:22px; }
.brand{ padding:0 8px; }
.brand .mark{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; color:var(--lime); text-transform:uppercase; }
.brand .name{ font-family:var(--font-display); font-size:20px; font-weight:600; margin-top:4px; }
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav button{ all:unset; cursor:pointer; font-size:13.5px; color:var(--muted); padding:9px 10px; border-radius:8px; display:flex; align-items:center; gap:9px; transition:background .14s ease, color .14s ease; }
.nav button .n{ font-family:var(--font-mono); font-size:10px; color:var(--muted-dim); flex:0 0 auto; transition:color .14s ease; }
.nav button:hover{ background:var(--panel-2); color:var(--ink); }
.nav button.active{ background:var(--panel-3); color:var(--lime); box-shadow:inset 2px 0 0 var(--lime); }
.nav button.active .n{ color:var(--lime); }
.rail-foot{ margin-top:auto; font-family:var(--font-mono); font-size:10px; color:var(--muted-dim); padding:0 8px; line-height:1.6; }

@media (max-width:820px){
  .app{ flex-direction:column; }
  .rail{ flex-direction:row; align-items:center; gap:10px; padding:14px 16px; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line); }
  .brand{ flex:0 0 auto; padding:0; }
  .nav{ flex-direction:row; gap:4px; }
  .nav button{ white-space:nowrap; }
  .rail-foot{ display:none; }
}

.main{ flex:1 1 auto; min-width:0; }
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:18px 24px; border-bottom:1px solid var(--line); }
@media (min-width:820px){ .topbar{ padding:20px 34px; } }
.topbar-left{ display:flex; align-items:center; gap:12px; }
.topbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.topbar label{ font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-dim); }
select#animalPick{ background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:13px; font-family:var(--font-mono); cursor:pointer; transition:border-color .14s ease; }
select#animalPick:hover{ border-color:var(--muted-dim); }
.score-pill{ display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:12px; color:var(--muted); background:var(--panel-2); border:1px solid var(--line); border-radius:100px; padding:6px 14px; }
.score-pill b{ color:var(--lime); font-size:14px; }
.pipeline-pill{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted-dim); background:var(--panel-2); border:1px solid var(--line); border-radius:100px; padding:6px 14px; }
.pipeline-pill b{ color:var(--cyan); }

.content{ padding:24px; }
@media (min-width:820px){ .content{ padding:34px; } }
.content h1{ font-family:var(--font-mono); font-weight:600; font-size:clamp(17px,2vw,21px); letter-spacing:.02em; text-transform:uppercase; margin:0 0 8px; }
.content p.desc{ font-size:14px; line-height:1.6; color:var(--muted); max-width:66ch; margin:0 0 22px; }

.toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:100px; overflow:hidden; }
.seg button{ all:unset; cursor:pointer; font-family:var(--font-mono); font-size:11px; padding:7px 14px; color:var(--muted); transition:background .14s ease, color .14s ease; }
.seg button:hover:not(.active){ background:var(--panel-3); color:var(--ink); }
.seg button.active{ background:var(--lime); color:var(--bg); font-weight:600; }
.check{ display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11.5px; color:var(--muted); cursor:pointer; user-select:none; transition:opacity .14s ease; }
.check:hover{ color:var(--ink); }
.check input{ accent-color:var(--lime); }
.check.off{ opacity:.4; }

.table-wrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; min-width:420px; font-size:13px; }
th{ text-align:left; font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-dim); padding:10px 16px; border-bottom:1px solid var(--line); }
td{ padding:10px 16px; border-bottom:1px solid var(--line); color:var(--ink); }
tr:last-child td{ border-bottom:none; }
td.num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--muted); }
td.aus{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--cyan); }
tr.flagged td{ background:rgba(224,101,79,.05); }
.marker-code{ font-family:var(--font-mono); font-size:9.5px; color:var(--muted-dim); margin-left:6px; }
.badge{ font-family:var(--font-mono); font-size:10.5px; padding:3px 9px; border-radius:100px; display:inline-block; white-space:nowrap; }
.badge.normal{ color:var(--lime); background:rgba(200,242,78,.1); }
.badge.watch{ color:var(--amber); background:rgba(232,181,102,.12); }
.badge.elevated{ color:var(--red); background:rgba(224,101,79,.12); }

.grid2{ display:grid; grid-template-columns:1.4fr 1fr; gap:20px; }
.grid2even{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
@media (max-width:640px){ .grid2,.grid2even,.grid3{ grid-template-columns:1fr; } }
.card{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:18px 20px; box-shadow:0 1px 0 rgba(0,0,0,.18), 0 10px 24px -18px rgba(0,0,0,.5); transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease; }
.gauge-card{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; }
.gauge-label{ font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; color:var(--muted-dim); text-transform:uppercase; }
.gauge-num{ font-family:var(--font-mono); font-size:36px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; }
.gauge-sub{ font-family:var(--font-mono); font-size:11px; }

.stat-card{ display:flex; flex-direction:column; gap:5px; }
.stat-label{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted-dim); }
.stat-val{ font-family:var(--font-mono); font-size:18px; font-weight:600; line-height:1.3; font-variant-numeric:tabular-nums; }
.spark-card{ display:flex; flex-direction:column; gap:6px; }
.spark-top{ display:flex; justify-content:space-between; align-items:baseline; }
.spark-name{ font-family:var(--font-mono); font-size:10px; color:var(--muted-dim); text-transform:uppercase; letter-spacing:.06em; }
.spark-latest{ font-family:var(--font-mono); font-size:11.5px; }

.chart-svg{ width:100%; height:auto; display:block; }
.chart-svg polyline{ stroke-linecap:round; stroke-linejoin:round; }
.chart-svg circle{ transition:r .15s ease; }

/* --- info button + modal --- */
.info-btn{ all:unset; cursor:pointer; font-family:var(--font-mono); font-size:10px; color:var(--muted-dim); border:1px solid var(--line); border-radius:100px; padding:4px 11px; white-space:nowrap; transition:color .14s ease, border-color .14s ease, background .14s ease; }
.info-btn:hover{ color:var(--lime); border-color:var(--lime); background:rgba(200,242,78,.06); }
.info-btn.block{ display:block; width:100%; text-align:center; padding:9px; margin-top:12px; border-radius:9px; font-size:10.5px; }
.modal-backdrop{ position:fixed; inset:0; background:rgba(4,9,6,.74); display:flex; align-items:center; justify-content:center; z-index:90; padding:20px; opacity:0; visibility:hidden; transition:opacity .18s ease, visibility 0s linear .18s; }
.modal-backdrop.open{ opacity:1; visibility:visible; transition:opacity .18s ease, visibility 0s linear 0s; }
.modal-box{ background:var(--panel-2); border:1px solid var(--line); border-radius:16px; padding:22px 24px 24px; max-width:420px; width:100%; max-height:82vh; overflow-y:auto; box-shadow:0 24px 70px rgba(0,0,0,.55); position:relative; transform:translateY(10px) scale(.97); transition:transform .18s cubic-bezier(.2,.8,.3,1); }
.modal-backdrop.open .modal-box{ transform:translateY(0) scale(1); }
.modal-close{ all:unset; position:absolute; top:14px; right:16px; cursor:pointer; color:var(--muted-dim); font-family:var(--font-mono); font-size:16px; line-height:1; padding:4px 6px; border-radius:6px; transition:color .14s ease, background .14s ease; }
.modal-close:hover{ color:var(--ink); background:var(--panel-3); }
.modal-title{ font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--lime); margin:0 26px 14px 0; }
.modal-body{ font-size:13px; line-height:1.6; color:var(--ink); }
.modal-body .event-protocol{ margin-top:12px; }
.modal-body .trigger-chips{ margin:0 0 4px; }

/* --- shared bar-chart components (dashboard + report) --- */
.hbar-row{ display:flex; align-items:center; gap:12px; padding:8px 0; }
.hbar-row.jumpable{ border-radius:8px; padding:8px 8px; margin:0 -8px; transition:background .14s ease; }
.hbar-row.jumpable:hover{ background:var(--panel-3); transform:none; box-shadow:none; }
.hbar-label{ flex:0 0 168px; font-family:var(--font-mono); font-size:11px; color:var(--muted); line-height:1.35; }
.hbar-track{ flex:1 1 auto; height:10px; background:var(--panel-3); border-radius:5px; overflow:hidden; position:relative; }
.hbar-fill{ height:100%; border-radius:5px; transition:width .2s ease; }
.hbar-val{ flex:0 0 auto; font-family:var(--font-mono); font-size:11.5px; color:var(--ink); min-width:44px; text-align:right; }

.vbar-chart{ display:flex; align-items:flex-end; gap:14px; height:130px; margin:16px 0 4px; padding:0 4px; }
.vbar-col{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; flex:1 1 0; gap:6px; }
.vbar-n{ font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--ink); }
.vbar-fill{ width:100%; max-width:54px; border-radius:6px 6px 2px 2px; min-height:4px; }
.vbar-lbl{ font-family:var(--font-mono); font-size:8.5px; color:var(--muted-dim); text-align:center; line-height:1.35; letter-spacing:.02em; }

.sbar{ display:flex; height:24px; border-radius:7px; overflow:hidden; background:var(--panel-3); }
.sbar-seg{ height:100%; }
.sbar-legend{ display:flex; gap:14px; margin-top:8px; flex-wrap:wrap; }
.sbar-legend-item{ display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10.5px; color:var(--muted); }
.sbar-legend-item .sw{ width:9px; height:9px; border-radius:2px; flex:0 0 auto; }

.cal-strip{ display:flex; height:26px; border-radius:7px; overflow:hidden; margin-top:14px; }
.cal-seg{ flex:1 1 0; height:100%; display:flex; align-items:center; justify-content:center; }
.cal-seg-lbl{ font-family:var(--font-mono); font-size:8px; color:rgba(10,23,16,.55); font-weight:600; }
.cal-months{ display:flex; margin-top:4px; }
.cal-month{ flex:1 1 0; text-align:center; font-family:var(--font-mono); font-size:8px; color:var(--muted-dim); }

.heat-table{ border-collapse:separate; border-spacing:4px; width:100%; }
.heat-table th{ padding:4px 6px; border-bottom:none; }
.heat-cell{ font-family:var(--font-mono); font-size:11px; text-align:center; border-radius:6px; padding:9px 4px; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; }
.heat-cell:hover{ transform:scale(1.07); box-shadow:0 6px 14px -6px rgba(0,0,0,.5); }
.heat-rowlbl{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted); white-space:nowrap; padding-right:8px; }

.mini-layer-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:14px 0 24px; }
@media (max-width:760px){ .mini-layer-grid{ grid-template-columns:repeat(2,1fr); } }
.mini-layer-card{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:11px 12px; display:flex; flex-direction:column; gap:6px; box-shadow:0 1px 0 rgba(0,0,0,.18), 0 10px 24px -18px rgba(0,0,0,.5); }
.mini-layer-id{ font-family:var(--font-mono); font-size:9.5px; color:var(--lime); letter-spacing:.06em; }
.mini-layer-track{ height:6px; background:var(--panel-3); border-radius:3px; overflow:hidden; }
.mini-layer-fill{ height:100%; border-radius:3px; }
.mini-layer-sub{ font-family:var(--font-mono); font-size:9px; color:var(--muted-dim); }

.corr-card{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px; box-shadow:0 1px 0 rgba(0,0,0,.18), 0 10px 24px -18px rgba(0,0,0,.5); }
.corr-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.corr-pair{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink); }
.corr-r{ font-family:var(--font-mono); font-size:14px; font-weight:600; }
.corr-note{ font-size:11.5px; color:var(--muted-dim); margin-top:5px; line-height:1.5; }

.chain-strip{ display:flex; align-items:center; gap:0; margin:14px 0 6px; overflow-x:auto; padding:4px 2px; }
.chain-node{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:6px; width:86px; position:relative; }
.chain-dot{ width:13px; height:13px; border-radius:50%; box-shadow:0 0 0 3px var(--panel-2); z-index:1; }
.chain-line{ flex:0 0 30px; height:1.4px; background:var(--line); margin-bottom:24px; }
.chain-lbl{ font-family:var(--font-mono); font-size:8.5px; color:var(--muted-dim); text-align:center; line-height:1.3; }
.chain-sub{ font-family:var(--font-mono); font-size:8px; color:var(--muted-dim); text-align:center; }

.lineage-list{ display:flex; flex-direction:column; }
.lineage-row{ display:flex; gap:14px; padding:10px 0; border-bottom:1px solid var(--line); }
.lineage-row:last-child{ border-bottom:none; }
.lineage-id{ flex:0 0 34px; font-family:var(--font-mono); font-size:10px; color:var(--lime); padding-top:1px; }
.lineage-body{ flex:1 1 auto; min-width:0; }
.lineage-src{ font-size:12.5px; color:var(--ink); }
.lineage-meta{ font-family:var(--font-mono); font-size:9.5px; color:var(--muted-dim); margin-top:2px; }

/* --- life tab --- */
.bio-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:26px; }
@media (max-width:700px){ .bio-grid{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:460px){ .bio-grid{ grid-template-columns:1fr; } }
.bio-item{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
.bio-l{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-dim); margin-bottom:4px; }
.bio-v{ font-size:13.5px; color:var(--ink); line-height:1.4; }

.sec-label{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-dim); margin:26px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.sec-label:first-child{ margin-top:0; }

.events-list{ display:flex; flex-direction:column; }
.event-row{ display:flex; gap:14px; padding:11px 0; border-bottom:1px solid var(--line); align-items:baseline; }
.event-row:last-child{ border-bottom:none; }
.event-date{ font-family:var(--font-mono); font-size:11px; color:var(--muted-dim); flex:0 0 108px; }
.event-label{ font-size:13.5px; color:var(--ink); }

.season-card{ display:flex; flex-direction:column; gap:8px; }
.season-tag{ font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
.season-place{ font-family:var(--font-body); font-size:15px; font-weight:800; letter-spacing:-.005em; }
.season-rows{ font-size:12.5px; color:var(--muted); line-height:1.7; }
.season-rows b{ color:var(--ink); font-weight:600; }
.season-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; }
.season-quality{ margin-top:2px; }
.season-quality .lbl{ font-family:var(--font-mono); font-size:9.5px; color:var(--muted-dim); display:flex; justify-content:space-between; margin-bottom:4px; }
.season-quality .track{ height:6px; background:var(--panel-3); border-radius:3px; overflow:hidden; }
.season-quality .fill{ height:100%; border-radius:3px; }

/* --- biomarker panel: collapsible layers --- */
details.layer-block{ border:1px solid var(--line); border-radius:12px; margin-bottom:12px; background:var(--panel-2); overflow:hidden; box-shadow:0 1px 0 rgba(0,0,0,.18), 0 10px 24px -18px rgba(0,0,0,.5); transition:border-color .14s ease; }
details.layer-block summary{ list-style:none; cursor:pointer; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; background:var(--panel-3); transition:background .14s ease; }
details.layer-block summary:hover{ background:var(--line); }
details.layer-block summary::-webkit-details-marker{ display:none; }
details.layer-block[open] summary{ border-bottom:1px solid var(--line); }
.lh-main{ display:flex; align-items:baseline; gap:9px; }
.lh-id{ font-family:var(--font-mono); font-size:10px; color:var(--lime); letter-spacing:.06em; }
.lh-name{ font-family:var(--font-body); font-size:13.5px; font-weight:800; }
.lh-right{ display:flex; align-items:center; gap:10px; }
.lh-flag{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted-dim); }
.lh-flag.hot{ color:var(--red); }

/* --- compound signals --- */
.heat-strip{ display:flex; flex-wrap:wrap; gap:12px; }
.heat-dot{ display:flex; flex-direction:column; align-items:center; gap:5px; width:38px; }
.hd-dot{ width:11px; height:11px; border-radius:50%; }
.hd-code{ font-family:var(--font-mono); font-size:8px; color:var(--muted-dim); text-align:center; line-height:1.2; }
.movers-list{ display:flex; flex-direction:column; margin-top:16px; }
.mover-row{ display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
.mover-row:last-child{ border-bottom:none; }
.mover-code{ font-family:var(--font-mono); font-size:11px; color:var(--ink); flex:0 0 auto; }
.mover-delta{ font-family:var(--font-mono); font-size:11px; text-align:right; }
.story-row{ display:flex; gap:13px; padding:12px 0; border-bottom:1px solid var(--line); }
.story-row:last-child{ border-bottom:none; }
.story-dot{ flex:0 0 auto; width:9px; height:9px; border-radius:50%; margin-top:5px; }
.story-body{ flex:1 1 auto; min-width:0; }
.story-wk{ font-family:var(--font-mono); font-size:10px; color:var(--muted-dim); margin-bottom:3px; letter-spacing:.05em; }
.story-text{ font-size:13px; color:var(--ink); line-height:1.55; }

/* --- compound events --- */
.event-list{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
@media (max-width:700px){ .event-list{ grid-template-columns:1fr; } }
.event-card{ background:var(--panel-2); border:1.4px solid var(--line); border-radius:12px; padding:16px 18px; box-shadow:0 1px 0 rgba(0,0,0,.18), 0 12px 26px -18px rgba(0,0,0,.5); }

<script>
(function(){
  "use strict";

  function esc(s){ return String(s).replace(/"/g,"&quot;"); }
  function infoBtn(label, title, bodyHtml, block){
    return "<button type=\"button\" class=\"info-btn"+(block?" block":"")+"\" data-mtitle=\""+esc(title)+"\" data-mbody=\""+esc(bodyHtml)+"\">"+label+"</button>";
  }

  function handshakeIcon(){
    return '<svg class="bridge-icon" viewBox="0 0 34 34" fill="none" role="img" aria-label="Kashmir and Australia connection">'
      + '<path d="M4 15 L11 15 L15 11 L18 14 L14 18 L17 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
      + '<path d="M30 15 L23 15 L19 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
      + '<path d="M14 18 L11 21 C10 22 8 22 7.5 20.5 C7 22 5 22 5 20 C4 21.5 2.5 20.5 3 19 L7 15" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>'
      + '<path d="M17 21 L20 24 C21 25 23 25 23.5 23.5 C24 25 26 25 26 23 C27 24.5 28.5 23.5 28 22 L24 18" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>'
      + '</svg>';
  }
  function bridgeCard(title, html, hot){
    return '<div class="bridge-card'+(hot?' hot':'')+'">'+handshakeIcon()+'<div class="bridge-body"><div class="bridge-title">'+title+'</div><div class="bridge-text">'+html+'</div></div></div>';
  }

  function linePoints(values, w, h, pad, min, max){
    var n = values.length;
    return values.map(function(v,i){
      var x = pad + (i/(n-1))*(w-2*pad);
      var y = h - pad - ((v-min)/(max-min))*(h-2*pad);
      return x.toFixed(1)+","+y.toFixed(1);
    }).join(" ");
  }
  function areaFill(values,w,h,pad,min,max,color){
    var pts = linePoints(values,w,h,pad,min,max);
    return "<polygon points=\""+pts+" "+(w-pad)+","+(h-pad)+" "+pad+","+(h-pad)+"\" fill=\""+color+"\" opacity=\".1\" stroke=\"none\"/>";
  }
  function endDot(values,w,h,pad,min,max,color){
    var n=values.length, x=pad+((n-1)/(n-1))*(w-2*pad), y=h-pad-((values[n-1]-min)/(max-min))*(h-2*pad);
    return "<circle cx=\""+x.toFixed(1)+"\" cy=\""+y.toFixed(1)+"\" r=\"3.4\" fill=\""+color+"\"/>";
  }
  function miniSpark(values,color,w,h){
    var pad=4, min=Math.min.apply(null,values), max=Math.max.apply(null,values);
    if(min===max){ min-=1; max+=1; }
    return "<svg class=\"chart-svg\" viewBox=\"0 0 "+w+" "+h+"\"><polyline points=\""+linePoints(values,w,h,pad,min,max)+"\" fill=\"none\" stroke=\""+color+"\" stroke-width=\"1.8\"/>"+endDot(values,w,h,pad,min,max,color)+"</svg>";
  }

  function riskColor(v){ return v>=50?"var(--red)":v>=25?"var(--amber)":"var(--lime)"; }

  // ---- the real Manzoor pipeline: 5 layers, 17 markers, static definitions shared across every animal ----
  var LAYERS = [
    { id:"L1", name:"Physical Status Gate", sub:"Run first &middot; zero cost in field", cost:"FREE" },
    { id:"L2", name:"Blood Protein Panel", sub:"&ldquo;Parasite channel&rdquo; (Manzoor) &middot; standard lab panel", cost:"LOW" },
    { id:"L3", name:"Parasite Intelligence", sub:"&ldquo;Sheep is the house of worms&rdquo; &mdash; Dr. Manzoor &middot; faecal + ELISA", cost:"LOW&ndash;MED" },
    { id:"L4", name:"Mineral Intelligence", sub:"AAS / ICASZA-based markers &middot; the silent Kashmir deficit", cost:"MEDIUM" },
    { id:"L5", name:"DNA + Confirmation Layer", sub:"Highest cost &middot; run only when L1&ndash;L4 requires confirmation", cost:"HIGH" }
  ];

  var MARKER_DEFS = [
    { id:"bcs",   layer:"L1", name:"Body Condition Score", code:"BCS", range:"2.5 &ndash; 3.5 (1&ndash;5 scale)",
      note:"BCS &lt; 2.5 &rarr; proceed to L1.2 + L2.1. BCS &lt; 2.0 in a non-pregnant ewe is an emergency signal." },
    { id:"hgb",   layer:"L1", name:"Haemoglobin", code:"Hgb", range:"8 &ndash; 16 g/dL",
      note:"Hgb &lt; 8 &rarr; proceed to L2 (protein) + L3 (parasite) simultaneously. Haemonchus contortus can drop Hgb 3&ndash;4 g/dL in 2 weeks." },
    { id:"tp",    layer:"L2", name:"Total Protein", code:"TP", range:"60 &ndash; 80 g/L",
      note:"TP &lt; 55 &rarr; proceed to L2.2 + L2.3 immediately. Seasonal threshold: 65 g/L summer, 55 g/L winter." },
    { id:"alb",   layer:"L2", name:"Albumin", code:"ALB", range:"27 &ndash; 36 g/L",
      note:"ALB &lt; 25 g/L with Hgb &lt; 8 = Haemonchus Collapse event firing. Most actionable single marker in Kashmir flocks." },
    { id:"glob",  layer:"L2", name:"Globulin", code:"GLOB", range:"28 &ndash; 44 g/L",
      note:"Rising globulin = active immune response to chronic worm exposure. Falling globulin = immune suppression." },
    { id:"ag",    layer:"L2", name:"Albumin : Globulin ratio", code:"A:G", range:"&gt; 0.8",
      note:"A:G &lt; 0.6 = the compound signal for chronic parasitic burden &mdash; proceed to L3 FEC immediately." },
    { id:"wbc",   layer:"L2", name:"White Cell Count", code:"WBC", range:"4 &ndash; 12 &times;10&sup9;/L",
      note:"WBC &lt; 4 with low albumin = Immune Suppression Pattern. WBC &gt; 12 with neutrophilia = bacterial secondary infection." },
    { id:"neut",  layer:"L2", name:"Neutrophils", code:"NEUT", range:"10 &ndash; 50%",

  // generalized elevation profile: plots N named pastures across the annual cycle, ordered as given
  function elevationSvg(seasons){
    var w=620,h=100,pad=44;
    var alts = seasons.map(function(s){ return s.altM; });
    var min = Math.min.apply(null,alts)-150, max = Math.max.apply(null,alts)+150;
    var n = seasons.length;
    var pts = seasons.map(function(s,i){
      var x = pad + (i/(n-1))*(w-2*pad);
      var y = h-pad - ((s.altM-min)/(max-min))*(h-2*pad-16) - 10;
      return {x:x,y:y,s:s};
    });
    var path = pts.map(function(p){ return p.x.toFixed(1)+","+p.y.toFixed(1); }).join(" ");
    var dots = pts.map(function(p,i){
      var labelY = (i%2===0) ? p.y-12 : p.y+20;
      return "<circle cx=\""+p.x.toFixed(1)+"\" cy=\""+p.y.toFixed(1)+"\" r=\"5\" fill=\"var(--"+p.s.color+")\"/>"
        + "<text x=\""+p.x.toFixed(1)+"\" y=\""+labelY.toFixed(1)+"\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"var(--"+p.s.color+")\">"+p.s.place.split(" ")[0]+"</text>"
        + "<text x=\""+p.x.toFixed(1)+"\" y=\""+(labelY+(i%2===0?-11:11)).toFixed(1)+"\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-size=\"8\" fill=\"var(--muted-dim)\">"+p.s.alt+"</text>";
    }).join("");
    return "<div class=\"card\" style=\"padding:16px 20px\"><svg class=\"chart-svg\" viewBox=\"0 0 "+w+" "+h+"\" role=\"img\" aria-label=\"Elevation profile across the annual grazing calendar\">"
      + "<polyline points=\""+path+"\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"1.4\" stroke-dasharray=\"3 4\"/>"
      + dots
      + "</svg></div>";
  }

  // annual grazing calendar as a 12-segment stacked bar, colored by which pasture the flock is on
  function grazingCalendarHtml(seasons, calendar){
    var byKey = {}; seasons.forEach(function(s){ byKey[s.key]=s; });
    var monthNames = ["J","F","M","A","M","J","J","A","S","O","N","D"];
    var segs = calendar.map(function(k){ var s=byKey[k]; return "<div class=\"cal-seg\" style=\"background:var(--"+s.color+")\" title=\""+s.place+"\"></div>"; }).join("");
    var months = monthNames.map(function(m){ return "<div class=\"cal-month\">"+m+"</div>"; }).join("");
    var legend = seasons.map(function(s){ return "<div class=\"sbar-legend-item\"><span class=\"sw\" style=\"background:var(--"+s.color+")\"></span>"+s.place+" &middot; "+s.months+"</div>"; }).join("");
    return "<div class=\"card\" style=\"padding:16px 20px\"><span class=\"stat-label\" style=\"display:block;margin-bottom:2px\">Annual transhumance calendar</span>"
      + "<div class=\"cal-strip\">"+segs+"</div><div class=\"cal-months\">"+months+"</div>"
      + "<div class=\"sbar-legend\" style=\"margin-top:12px\">"+legend+"</div></div>";
  }

  function stackedBarHtml(segments, total){
    var segs = segments.map(function(s){

      return "<div class=\"sbar-seg\" style=\"width:"+pct.toFixed(2)+"%;background:"+s.color+"\" title=\""+s.label+": "+s.n+"\"></div>";

    return "<div class=\"sbar\">"+segs+"</div><div class=\"sbar-legend\">"+legend+"</div>";
  }

  function pearson(x,y){
    var n=x.length, sx=0,sy=0,sxy=0,sx2=0,sy2=0;
    for(var i=0;i<n;i++){ sx+=x[i]; sy+=y[i]; sxy+=x[i]*y[i]; sx2+=x[i]*x[i]; sy2+=y[i]*y[i]; }
    var num = n*sxy - sx*sy;
    var den = Math.sqrt((n*sx2-sx*sx)*(n*sy2-sy*sy));
    return den===0 ? 0 : num/den;
  }

  function renderSignals(a){
    var s = state.showSeries;
    var w=520,h=170,pad=16,min=0,max=65;
    var lines = "", fills = "";
    if(s.hgb){ fills += areaFill(a.signals.hgb,w,h,pad,min,max,"var(--red)"); lines += "<polyline points=\""+linePoints(a.signals.hgb,w,h,pad,min,max)+"\" fill=\"none\" stroke=\"var(--red)\" stroke-width=\"2\"/>"+endDot(a.signals.hgb,w,h,pad,min,max,"var(--red)"); }
    if(s.pcv){ fills += areaFill(a.signals.pcv,w,h,pad,min,max,"var(--amber)"); lines += "<polyline points=\""+linePoints(a.signals.pcv,w,h,pad,min,max)+"\" fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"2\"/>"+endDot(a.signals.pcv,w,h,pad,min,max,"var(--amber)"); }
    if(s.alb){ fills += areaFill(a.signals.alb,w,h,pad,min,max,"var(--cyan)"); lines += "<polyline points=\""+linePoints(a.signals.alb,w,h,pad,min,max)+"\" fill=\"none\" stroke=\"var(--cyan)\" stroke-width=\"1.8\" opacity=\".9\"/>"+endDot(a.signals.alb,w,h,pad,min,max,"var(--cyan)"); }
    var annot = (a.signalAnnotations||[]).map(function(an){
      var x = pad + (an.idx/7)*(w-2*pad);
      return "<line x1=\""+x+"\" y1=\"12\" x2=\""+x+"\" y2=\""+(h-pad)+"\" stroke=\"var(--muted-dim)\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/>"
        + "<text x=\""+(x+5)+"\" y=\"22\" font-family=\"IBM Plex Mono\" font-size=\"9\" fill=\"var(--ink)\">"+an.label+"</text>";
    }).join("");
    var last = [a.signals.hgb[a.signals.hgb.length-1], a.signals.pcv[a.signals.pcv.length-1], a.signals.alb[a.signals.alb.length-1]];
    var idx = Math.round((last[0]+last[1]+last[2])/3);
    var gc = idx>=50?"var(--red)":idx>=25?"var(--amber)":"var(--lime)";
    var trend = idx>=50?"rising sharply, 5 wks":idx>=25?"rising, watch":"flat, stable";
    var heatDots = MARKER_DEFS.map(function(m){
      var st = a.markers[m.id].status;
      var c = st==="normal"?"var(--lime)":st==="watch"?"var(--amber)":"var(--red)";
      return "<div class=\"heat-dot\"><span class=\"hd-dot\" style=\"background:"+c+"\"></span><span class=\"hd-code\">"+m.code+"</span></div>";
    }).join("");
    var movers = a.movers.map(function(mv){
      return "<div class=\"mover-row\"><span class=\"mover-code\">"+mv.code+"</span><span style=\"flex:1;color:var(--muted);padding:0 10px\">"+mv.note+"</span><span class=\"mover-delta\" style=\"color:"+mv.color+"\">"+mv.delta+"</span></div>";
    }).join("");
    var modalBody = "<div class=\"heat-strip\">"+heatDots+"</div><div class=\"movers-list\">"+movers+"</div>";
    var storyRows = (a.story||[]).map(function(s){
      return "<div class=\"story-row\"><span class=\"story-dot\" style=\"background:var(--"+s.c+")\"></span><div class=\"story-body\"><div class=\"story-wk\">"+s.wk+"</div><div class=\"story-text\">"+s.text+"</div></div></div>";
    }).join("");
    var pairs = [
      {a:"hgb",b:"pcv",la:"Hgb",lb:"PCV"},
      {a:"hgb",b:"alb",la:"Hgb",lb:"Albumin"},
      {a:"pcv",b:"alb",la:"PCV",lb:"Albumin"}
    ];
    var corrCards = pairs.map(function(p){
      var r = pearson(a.signals[p.a], a.signals[p.b]);
      var rr = r.toFixed(2);
      var strength = Math.abs(r)>=0.85?"very strong co-movement":Math.abs(r)>=0.6?"strong co-movement":Math.abs(r)>=0.3?"moderate co-movement":"weak / independent";
      var c = Math.abs(r)>=0.6?"var(--red)":Math.abs(r)>=0.3?"var(--amber)":"var(--lime)";
      var note = Math.abs(r)>=0.6
        ? "These two markers are rising or falling together &mdash; the compound-event logic weights correlated markers higher than any single reading."
        : "These two are moving mostly independently right now &mdash; useful for ruling a compound pattern in or out.";
      return "<div class=\"corr-card\"><div class=\"corr-top\"><span class=\"corr-pair\">"+p.la+" &harr; "+p.lb+"</span><span class=\"corr-r\" style=\"color:"+c+"\">r&#8202;=&#8202;"+rr+"</span></div>"
        + "<div class=\"hbar-track\" style=\"height:6px\"><div class=\"hbar-fill\" style=\"width:"+(Math.abs(r)*100).toFixed(0)+"%;height:100%;background:"+c+"\"></div></div>"
        + "<div class=\"corr-note\">"+strength+" over 8 weeks. "+note+"</div></div>";
    }).join("");
    return "<h1>Compound Signals</h1>"
    + "<p class=\"desc\">Hgb, PCV and Albumin are the Haemonchus Collapse triad &mdash; the three markers that move fastest in an acute crisis. Each line is how far below its healthy floor that marker sits, week over week.</p>"
    + "<div class=\"sec-label\">The story so far &middot; this sheep's cycle, in order</div>"
    + "<div class=\"card\" style=\"padding:4px 20px 8px\">"+storyRows+"</div>"
    + "<div class=\"toolbar\">"
    +   "<label class=\"check "+(s.hgb?"":"off")+"\"><input type=\"checkbox\" data-series=\"hgb\" "+(s.hgb?"checked":"")+"><span style=\"color:var(--red)\">&#9679;</span> Haemoglobin</label>"
    +   "<label class=\"check "+(s.pcv?"":"off")+"\"><input type=\"checkbox\" data-series=\"pcv\" "+(s.pcv?"checked":"")+"><span style=\"color:var(--amber)\">&#9679;</span> PCV</label>"
    +   "<label class=\"check "+(s.alb?"":"off")+"\"><input type=\"checkbox\" data-series=\"alb\" "+(s.alb?"checked":"")+"><span style=\"color:var(--cyan)\">&#9679;</span> Albumin</label>"
    + "</div>"
    + "<div class=\"grid2\"><div class=\"card\"><svg class=\"chart-svg\" viewBox=\"0 0 "+w+" "+h+"\" role=\"img\" aria-label=\"Compound signal trends across recent weeks\">"
    +   fills
    +   "<line x1=\""+pad+"\" y1=\""+(h-pad-52)+"\" x2=\""+(w-pad)+"\" y2=\""+(h-pad-52)+"\" stroke=\"var(--line)\" stroke-width=\"1\"/>"+lines+annot
    +   "<text x=\""+pad+"\" y=\""+(h-4)+"\" font-family=\"IBM Plex Mono\" font-size=\"8.5\" fill=\"var(--muted-dim)\">WK 27</text>"
    +   "<text x=\""+(w-pad)+"\" y=\""+(h-4)+"\" text-anchor=\"end\" font-family=\"IBM Plex Mono\" font-size=\"8.5\" fill=\"var(--muted-dim)\">WK 34</text>"
    + "</svg></div><div class=\"card gauge-card\"><div class=\"gauge-label\">Collapse risk index</div>"
    + "<div class=\"gauge-num\" style=\"color:"+gc+"\">"+idx+"</div><div class=\"gauge-sub\" style=\"color:"+gc+"\">"+trend+"</div></div></div>"
    + "<div class=\"sec-label\">Cross-marker correlation &middot; do these signals actually move together?</div>"
    + corrCards
    + infoBtn("View full 17-marker heat-map &amp; fastest movers &rarr;", "Full panel heat-map &middot; fastest movers", modalBody, true);
  }

      return "<div class=\"layer-bar-col\"><div class=\"layer-bar-fill\" style=\"height:"+h+"%;background:"+c+"\"></div><div class=\"layer-bar-lbl\">"+LAYERS[i].id+"</div></div>";
    }).join("");
    return "<div class=\"layer-bar-wrap\"><span class=\"l\">Layer contribution to this match</span><div class=\"layer-bar\">"+cols+"</div></div>";
  }

  function eventHeatmapHtml(currentId){
    var head = EVENT_DEFS.map(function(d){ return "<th style=\"text-align:center;font-family:var(--font-mono);font-size:9px;color:var(--muted-dim)\">"+d.code.replace("SBP-OV-","EV")+"</th>"; }).join("");
    var rows = ORDER.map(function(id){
      var an = ANIMALS[id];
      var isCurrent = id===currentId;

        return "<td class=\"heat-cell jumpable\" style=\"background:"+(ev.status==="confirmed"?"rgba(224,101,79,.22)":ev.status==="monitoring"?"rgba(232,181,102,.18)":"rgba(200,242,78,.06)")+";color:"+c+(isCurrent?";box-shadow:inset 0 0 0 1.4px var(--lime)":"")+"\""+jumpAttr(id,"events")+" title=\""+def.name+" &middot; "+ev.pct+"%\">"+ev.pct+"%</td>";
      }).join("");
      return "<tr><td class=\"heat-rowlbl"+(isCurrent?"":"")+"\" style=\""+(isCurrent?"color:var(--lime)":"")+"\">"+id+(isCurrent?" &middot; viewing":"")+"</td>"+cells+"</tr>";
    }).join("");
    return "<div class=\"table-wrap\"><table class=\"heat-table\"><thead><tr><th></th>"+head+"</tr></thead><tbody>"+rows+"</tbody></table></div>"

  }

  function renderEvents(a){
    var cards = EVENT_DEFS.map(function(def){
      var ev = a.events[def.id];
      var metCount = ev.met.filter(function(x){return x;}).length;
      var chips = def.triggers.map(function(t,i){ return "<span class=\"trigger-chip"+(ev.met[i]?" met":"")+"\">"+t+"</span>"; }).join("");
      var detected = ev.detected ? "<div class=\"event-detected\">"+ev.detected+"</div>" : "";
      var modalBody = "<div class=\"trigger-chips\">"+chips+"</div>"+layerBarHtml(def.weights, ev.pct)+detected
        + "<div class=\"event-protocol\"><span class=\"l\">Protocol</span>"+def.protocol+"</div>"
        + "<div class=\"event-note\">"+def.note+"</div>";
      return "<div class=\"event-card "+ev.status+"\">"
        + "<div class=\"event-top\"><div><div class=\"event-code\">"+def.code+"</div><div class=\"event-name\">"+def.name+"</div></div>"
        + "<div class=\"event-match\"><div class=\"n\" style=\"color:"+(ev.status==="confirmed"?"var(--red)":ev.status==="monitoring"?"var(--amber)":"var(--muted-dim)")+"\">"+ev.pct+"%</div><div class=\"l\">match</div></div></div>"
        + "<div class=\"event-meta\">"+eventBadge(ev.status)+"<span class=\"cond\">"+metCount+"/"+def.triggers.length+" conditions met</span></div>"
        + infoBtn("View details &rarr;", def.code+" "+def.name, modalBody, true)
        + "</div>";
    }).join("");
    var topEvent = null, topPct=-1;
    EVENT_DEFS.forEach(function(def){ var ev=a.events[def.id]; if(ev.pct>topPct){ topPct=ev.pct; topEvent=def; } });
    var coOccur = EVENT_DEFS.filter(function(def){ return def.id!==topEvent.id && a.events[def.id].pct>=20; })
      .map(function(def){ return def.code+" ("+a.events[def.id].pct+"%)"; });
    return "<h1>Compound Events</h1>"
    + "<p class=\"desc\">The SBP-OV pipeline runs the same five named compound events against every animal, every week. Each card shows the match and how many conditions are met &mdash; the full trigger list, layer breakdown and protocol are one tap away.</p>"
    + "<div class=\"event-list\">"+cards+"</div>"
    + "<div class=\"sec-label\">Co-occurrence &middot; this animal, this cycle</div>"
    + "<div class=\"card\"><div style=\"font-size:13px;color:var(--ink);line-height:1.6\">Dominant event: <b style=\"color:var(--lime)\">"+topEvent.code+" "+topEvent.name+"</b> at "+topPct+"%."
    + (coOccur.length ? " Running alongside it at &ge;20% match: <b style=\"color:var(--amber)\">"+coOccur.join(", ")+"</b> &mdash; worth treating as one compound picture, not five independent checks." : " No other event is co-trending above 20% this cycle &mdash; a clean single-event read, which is itself useful signal.")
    + "</div></div>"
    + bridgeCard("High priority for CSIRO collaboration",
        "The Copper Accumulation Alert is the pipeline's “silent killer” pattern &mdash; slow accumulation, no visible warning, then a 24&ndash;72 hour crisis. <b>Dr. Manzoor flagged this as an identical accumulation pattern to CSIRO's own ImmuneDEX research gap.</b> This is a live field cohort with exactly the data CSIRO doesn't have in-house.", true)
    + "<div class=\"sec-label\">Flock-wide event heat-map &middot; all six cases &times; all five events</div>"
    + eventHeatmapHtml(state.animal);
  }

  function journeyBlobsHtml(a){
    var items = [{lbl:"ENROLLED", sub:a.life.enrolled.split(" &middot;")[0], risk:2}];
    var wkLabels=["WK 27","WK 28","WK 29","WK 30","WK 31","WK 32","WK 33","WK 34"];
    for(var i=0;i<8;i++){
      var risk = Math.round((a.signals.hgb[i]+a.signals.pcv[i]+a.signals.alb[i])/3);
      items.push({ lbl: wkLabels[i]+(i===7?" &middot; TODAY":""), sub: "risk "+risk, risk: risk });
    }
    return items.map(function(it){
      var size = Math.max(12, Math.min(28, 13+it.risk*0.3));
      var c = riskColor(it.risk);
      return "<div class=\"j-blob\"><div class=\"j-dotwrap\"><div class=\"j-dot\" style=\"width:"+size+"px;height:"+size+"px;background:"+c+"\"></div></div>"
        + "<div class=\"j-wk\">"+it.lbl+"</div><div class=\"j-val\" style=\"color:"+c+"\">"+it.sub+"</div></div>";
    }).join("");
  }

  function renderVelocity(a){
    var v = a.velocity;
    var w=620,h=190,pad=16;
    var levelPts = linePoints(v.level,w,h,pad,v.levelMin,v.levelMax);
    var velPts = linePoints(v.vel,w,h,pad,0,45);
    var thresholdLine = "";
    if(v.threshold!=null){
      var x = pad + (v.threshold/(v.level.length-1))*(w-2*pad);
      thresholdLine = "<line x1=\""+x+"\" y1=\"10\" x2=\""+x+"\" y2=\"170\" stroke=\"var(--amber)\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/>"
        + "<text x=\""+(x+6)+"\" y=\"22\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"var(--amber)\">"+v.thresholdLabel+"</text>";
    }
    var benchLine = "";
    if(v.cohortAvg!=null){
      var by = h-pad-((v.cohortAvg-v.levelMin)/(v.levelMax-v.levelMin))*(h-2*pad);
      benchLine = "<line x1=\""+pad+"\" y1=\""+by.toFixed(1)+"\" x2=\""+(w-pad)+"\" y2=\""+by.toFixed(1)+"\" stroke=\"var(--muted-dim)\" stroke-width=\"1\" stroke-dasharray=\"1 5\"/>"
        + "<text x=\""+(w-pad)+"\" y=\""+(by-4).toFixed(1)+"\" text-anchor=\"end\" font-family=\"IBM Plex Mono\" font-size=\"8.5\" fill=\"var(--muted-dim)\">Cohort avg "+v.cohortAvg+" "+v.unit+"</text>";
    }
    var st = v.stats;
    var firstHalf = v.vel.slice(0,4), secondHalf = v.vel.slice(4);
    var avg1 = firstHalf.reduce(function(s,x){return s+x;},0)/firstHalf.length;
    var avg2 = secondHalf.reduce(function(s,x){return s+x;},0)/secondHalf.length;
    var accel = avg2-avg1;
    var accelPct = Math.min(100, Math.abs(accel)*6);
    var accelLabel = accel>3?"Accelerating":accel<-3?"Decelerating":"Steady";
    var accelColor = accel>3?"var(--red)":accel<-3?"var(--lime)":"var(--amber)";
    var headroom = v.cohortAvg!=null ? (v.level[v.level.length-1]-v.cohortAvg) : null;
    return "<h1>Velocity</h1>"
    + "<p class=\"desc\">The level matters less than how fast it's moving &mdash; this tab tracks whichever marker is actually critical for this animal, benchmarked against its cohort average. Journey snapshot first, the numbers behind it next, the detail chart last.</p>"
    + "<div class=\"sec-label\">Journey snapshot &middot; enrollment to today</div>"
    + "<div class=\"card\"><div class=\"journey-strip\">"+journeyBlobsHtml(a)+"</div></div>"
    + "<div class=\"sec-label\">Rate-of-change summary &middot; "+v.metricLabel+"</div>"
    + "<div class=\"grid3\">"
    +   "<div class=\"card stat-card\"><div class=\"stat-label\">Total change, 8 wks</div><div class=\"stat-val\">"+st.total+"</div></div>"
    +   "<div class=\"card stat-card\"><div class=\"stat-label\">Fastest weekly move</div><div class=\"stat-val\">"+st.fastest+"</div></div>"
    +   "<div class=\"card stat-card\"><div class=\"stat-label\">Outlook</div><div class=\"stat-val\" style=\"font-size:14px;line-height:1.5\">"+st.proj+"</div></div>"
    + "</div>"
    + "<div class=\"grid2\">"
    +   "<div class=\"card stat-card\"><div class=\"stat-label\">Momentum &middot; first half vs second half of cycle</div>"
    +     "<div class=\"stat-val\" style=\"color:"+accelColor+"\">"+accelLabel+"</div>"
    +     "<div class=\"hbar-track\" style=\"margin-top:6px\"><div class=\"hbar-fill\" style=\"width:"+Math.max(accelPct,4).toFixed(0)+"%;background:"+accelColor+"\"></div></div>"
    +     "<div class=\"stat-sub\" style=\"margin-top:4px\">avg rate wk27&ndash;30: "+avg1.toFixed(1)+" &rarr; wk31&ndash;34: "+avg2.toFixed(1)+"</div></div>"
    +   "<div class=\"card stat-card\"><div class=\"stat-label\">Headroom vs cohort average</div>"
    +     (headroom!=null
        ? "<div class=\"stat-val\" style=\"color:"+(headroom<0?"var(--red)":"var(--lime)")+"\">"+(headroom>=0?"+":"")+headroom.toFixed(1)+" "+v.unit+"</div><div class=\"stat-sub\">latest "+v.metricLabel+" vs "+v.cohortAvg+" "+v.unit+" cohort avg</div>"
        : "<div class=\"stat-val\">&mdash;</div><div class=\"stat-sub\">no cohort benchmark set for this metric</div>")
    +   "</div>"
    + "</div>"
    + "<div class=\"sec-label\">Standard triad trend &middot; last 8 weeks</div>"
    + "<div class=\"grid3\">"
    +   "<div class=\"card spark-card\"><div class=\"spark-top\"><span class=\"spark-name\">PCV</span><span class=\"spark-latest\">"+a.markers.pcv.v+"</span></div>"+miniSpark(a.signals.pcv,"var(--amber)",160,52)+"</div>"
    +   "<div class=\"card spark-card\"><div class=\"spark-top\"><span class=\"spark-name\">Hgb risk</span><span class=\"spark-latest\">"+a.markers.hgb.v+"</span></div>"+miniSpark(a.signals.hgb,"var(--red)",160,52)+"</div>"
    +   "<div class=\"card spark-card\"><div class=\"spark-top\"><span class=\"spark-name\">Albumin risk</span><span class=\"spark-latest\">"+a.markers.alb.v+"</span></div>"+miniSpark(a.signals.alb,"var(--cyan)",160,52)+"</div>"
    + "</div>"
    + "<div class=\"sec-label\">Detail &middot; "+v.metricLabel+" level &amp; rate of change, vs cohort average</div>"
    + "<div class=\"card\"><svg class=\"chart-svg\" viewBox=\"0 0 "+w+" "+h+"\" role=\"img\" aria-label=\"Critical marker level and rate-of-change trend lines for the selected animal\">"
    +   benchLine
    +   "<line x1=\""+pad+"\" y1=\"90\" x2=\""+(w-pad)+"\" y2=\"90\" stroke=\"var(--line)\" stroke-width=\"1\"/>"
    +   "<polyline points=\""+levelPts+"\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.6\"/>"
    +   "<polyline points=\""+velPts+"\" fill=\"none\" stroke=\"var(--lime)\" stroke-width=\"2.2\"/>"+thresholdLine
    +   "<text x=\""+pad+"\" y=\"184\" font-family=\"IBM Plex Mono\" font-size=\"8.5\" fill=\"var(--muted-dim)\">WK 27</text>"
    +   "<text x=\""+(w-pad)+"\" y=\"184\" text-anchor=\"end\" font-family=\"IBM Plex Mono\" font-size=\"8.5\" fill=\"var(--muted-dim)\">WK 34</text>"
    +   "<text x=\""+pad+"\" y=\"12\" font-family=\"IBM Plex Mono\" font-size=\"9\" fill=\"var(--lime)\">&mdash; rate of change (relative)</text>"
    +   "<text x=\""+(pad+200)+"\" y=\"12\" font-family=\"IBM Plex Mono\" font-size=\"9\" fill=\"var(--muted)\">&mdash; "+v.metricLabel+" level ("+v.unit+")</text>"
    + "</svg></div>";
  }

  function renderReport(a, id){
    var top = null, topPct = -1;
    EVENT_DEFS.forEach(function(def){ var ev=a.events[def.id]; if(ev.pct>topPct){ topPct=ev.pct; top={def:def, ev:ev}; } });
    var flaggedCount = MARKER_DEFS.filter(function(m){ return a.markers[m.id].status!=="normal"; }).length;

    var stamps = a.life.events.map(function(e,i){
      var isLast = i===a.life.events.length-1;
      var flag = isLast && top.ev.status==="confirmed";
      return "<div class=\"stamp"+(flag?" flag":"")+"\"><span class=\"sd\">"+e.date+"</span>"+e.label+"</div>";
    }).join("");

    var layerWorst = {};
    var layerBars = LAYERS.map(function(L){
      var defs = MARKER_DEFS.filter(function(m){ return m.layer===L.id; });
      var flagged = defs.filter(function(m){ return a.markers[m.id].status!=="normal"; }).length;
      var worst = "normal";
      defs.forEach(function(m){ var st=a.markers[m.id].status; if(st==="elevated") worst="elevated"; else if(st==="watch"&&worst!=="elevated") worst="watch"; });
      layerWorst[L.id]=worst;
      var c = worst==="elevated"?"var(--red)":worst==="watch"?"var(--amber)":"var(--lime)";
      var pct = defs.length ? Math.max((flagged/defs.length*100), flagged?8:2) : 2;
      return "<div class=\"hbar-row\"><div class=\"hbar-label\">"+L.id+" &middot; "+L.name+"</div>"
        + "<div class=\"hbar-track\"><div class=\"hbar-fill\" style=\"width:"+pct+"%;background:"+c+"\"></div></div>"
        + "<div class=\"hbar-val\" style=\"color:"+c+"\">"+flagged+"/"+defs.length+"</div></div>";
    }).join("");

    var eventBars = EVENT_DEFS.map(function(def){
      var ev = a.events[def.id];
      var c = riskColor(ev.pct);
      return "<div class=\"hbar-row jumpable\""+jumpAttr(id,"events")+"><div class=\"hbar-label\">"+def.code+" "+def.name+"</div>"
        + "<div class=\"hbar-track\"><div class=\"hbar-fill\" style=\"width:"+Math.max(ev.pct,2)+"%;background:"+c+"\"></div></div>"
        + "<div class=\"hbar-val\" style=\"color:"+c+"\">"+ev.pct+"%</div></div>";
    }).join("");

    var chainSteps = [
      {lbl:"Born", sub:a.life.dob, color:"muted-dim"},
      {lbl:"Enrolled", sub:a.life.enrolled.split(" &middot;")[0], color:"cyan"}
    ];
    LAYERS.forEach(function(L){
      var w = layerWorst[L.id];
      chainSteps.push({lbl:L.id+" run", sub:w==="normal"?"clear":w==="watch"?"watch":"flagged", color:w==="elevated"?"red":w==="watch"?"amber":"lime"});
    });
    chainSteps.push({lbl:top.ev.status==="confirmed"?"Event confirmed":top.ev.status==="monitoring"?"Monitoring":"All clear", sub:top.def.code, color:top.ev.status==="confirmed"?"red":top.ev.status==="monitoring"?"amber":"lime"});
    chainSteps.push({lbl:"Report generated", sub:"today", color:"lime"});
    var chainHtml = chainSteps.map(function(st,i){
      return (i>0?"<div class=\"chain-line\"></div>":"") + "<div class=\"chain-node\"><div class=\"chain-dot\" style=\"background:var(--"+st.color+")\"></div><div class=\"chain-lbl\">"+st.lbl+"</div><div class=\"chain-sub\">"+st.sub+"</div></div>";
    }).join("");

    var lineageHtml = DATA_LINEAGE.map(function(L){
      return "<div class=\"lineage-row\"><div class=\"lineage-id\">"+L.id+"</div><div class=\"lineage-body\"><div class=\"lineage-src\">"+L.src+"</div><div class=\"lineage-meta\">"+L.meta+"</div></div></div>";
    }).join("");

    var actions = top.def.protocol.split(". ").filter(function(x){ return x.trim().length; }).map(function(x){ return "<li>"+x.replace(/\.$/,"")+".</li>"; }).join("");
    var docRef = "SBP-OV-2026-"+id.replace("TV-OV-","")+"-W34";

    return "<h1>Report</h1>"
    + "<p class=\"desc\">A digital passport for this animal &mdash; identity, the full journey from enrollment to today, and exactly where it stands right now.</p>"
    + "<div class=\"passport\">"
    +   "<div class=\"passport-head\"><div class=\"passport-idwrap\"><div class=\"passport-id\">"+id+"</div><div class=\"passport-doc\">"+a.breed+" &middot; SBP-OV v1.0 digital passport</div></div>"
    +   "<div class=\"passport-seal\"><div class=\"n\">"+a.score+"</div><div class=\"l\">Provenance</div></div></div>"
    +   "<div class=\"bio-grid\" style=\"margin-bottom:10px\">"
    +     "<div class=\"bio-item\"><div class=\"bio-l\">Born</div><div class=\"bio-v\">"+a.life.dob+"</div></div>"
    +     "<div class=\"bio-item\"><div class=\"bio-l\">Enrolled</div><div class=\"bio-v\">"+a.life.enrolled+"</div></div>"
    +     "<div class=\"bio-item\"><div class=\"bio-l\">Current status</div><div class=\"bio-v\">"+top.def.name+" &mdash; "+top.ev.pct+"%</div></div>"
    +   "</div>"
    +   "<div class=\"sec-label\">Intelligence summary</div>"
    +   "<div class=\"card\" style=\"margin-bottom:6px\"><div style=\"font-size:13.5px;color:var(--ink);line-height:1.65\">"+a.intelSummary+"</div>"
    +     "<div style=\"display:flex;align-items:center;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)\">"
    +       "<div style=\"flex:1\">"+miniSpark(a.confidenceTrend,"var(--lime)",240,40)+"</div>"
    +       "<div style=\"text-align:right\"><div style=\"font-family:var(--font-mono);font-size:19px;font-weight:600;color:var(--lime);font-variant-numeric:tabular-nums\">"+top.ev.pct+"%</div><div style=\"font-family:var(--font-mono);font-size:9px;color:var(--muted-dim);text-transform:uppercase\">confidence, wk 27&rarr;34</div></div>"
    +     "</div></div>"
    +   "<div class=\"sec-label\">Provenance chain &middot; every step that produced this document</div>"
    +   "<div class=\"card\" style=\"padding:12px 16px\"><div class=\"chain-strip\">"+chainHtml+"</div></div>"
    +   "<div class=\"sec-label\">Journey stamps &middot; day one to today</div>"
    +   "<div class=\"stamp-row\">"+stamps+"</div>"
    +   "<div class=\"sec-label\">Commercial case &middot; this animal</div>"
    +   "<div class=\"commercial-grid\">"
    +     "<div class=\"card flock-stat\"><span class=\"stat-label\">Value at risk</span><span class=\"stat-val\" style=\"color:var(--red)\">"+a.commercial.atRisk+"</span><span class=\"stat-sub\">"+a.commercial.atRiskNote+"</span></div>"
    +     "<div class=\"card flock-stat\"><span class=\"stat-label\">Treatment cost</span><span class=\"stat-val\">"+a.commercial.treatCost+"</span><span class=\"stat-sub\">"+a.commercial.treatNote+"</span></div>"
    +     "<div class=\"card flock-stat\"><span class=\"stat-label\">Net saved</span><span class=\"stat-val\" style=\"color:var(--lime)\">"+a.commercial.netSaved+"</span><span class=\"stat-sub\">"+a.commercial.netNote+"</span></div>"
    +   "</div>"
    +   "<div class=\"sec-label\">Layer-by-layer status &middot; "+flaggedCount+" of 17 markers flagged</div>"
    +   "<div class=\"card\">"+layerBars+"</div>"
    +   "<div class=\"sec-label\">All five compound events, this cycle &middot; match %</div>"
    +   "<div class=\"card\">"+eventBars+"</div>"
    +   "<div class=\"sec-label\">Recommended next actions</div>"
    +   "<ol class=\"action-list\">"+actions+"</ol>"
    +   "<div class=\"report-note\"><b>Summary:</b> "+a.report.recommendation+"</div>"
    +   "<div class=\"sec-label\">Data lineage &middot; where each layer's numbers come from</div>"
    +   "<div class=\"card\"><div class=\"lineage-list\">"+lineageHtml+"</div></div>"
    +   "<div class=\"sec-label\">The CSIRO/AWI gap this fills</div>"
    +   "<div class=\"gap-list\">"+CSIRO_GAP.map(function(g){ return "<div class=\"gap-row\"><span class=\"gm\">&#9679;</span>"+g+"</div>"; }).join("")+"</div>"
    +   "<div class=\"passport-foot\"><span>Certified by TerraVeri Console &middot; SBP-OV v1.0 &middot; ref "+docRef+"</span><span>Generated automatically, every week, every animal</span></div>"
    + "</div>";
  }

  var lastSync = Date.now();
  function syncText(){
    var s = Math.max(0, Math.round((Date.now()-lastSync)/1000));
    return s<1 ? "computed just now" : "computed "+s+"s ago";
  }
  function tickSync(){
    var t = syncText();
    var a1 = document.getElementById("syncNote"); if(a1) a1.textContent = t;
    var a2 = document.getElementById("statusSync"); if(a2) a2.textContent = t;
  }
  setInterval(tickSync, 1000);

  var loadBar = document.getElementById("loadBar");
  function render(){
    var a = ANIMALS[state.animal];
    document.getElementById("scorePill").textContent = a.score;
    animalPick.value = state.animal;
    document.querySelectorAll("#nav button").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-nav")===state.nav); });

    var html;
    if(state.nav==="flock") html = renderFlock();
    else if(state.nav==="life") html = renderLife(a);
    else if(state.nav==="panel") html = renderPanel(a);
    else if(state.nav==="signals") html = renderSignals(a);
    else if(state.nav==="events") html = renderEvents(a);
    else if(state.nav==="velocity") html = renderVelocity(a);
    else html = renderReport(a, state.animal);

    var content = document.getElementById("content");
    content.classList.add("tv-loading");
    if(loadBar){ loadBar.classList.add("active"); loadBar.style.width="60%"; }
    window.clearTimeout(render._t);
    render._t = window.setTimeout(function(){
      content.innerHTML = html;
      content.classList.remove("tv-loading");
      lastSync = Date.now();
      tickSync();
      if(loadBar){
        loadBar.style.width="100%";
        window.setTimeout(function(){ loadBar.classList.remove("active"); loadBar.style.width="0%"; }, 180);
      }
    }, 130);
  }

  var modalBackdrop = document.getElementById("modalBackdrop");
  function openModal(title, body){
    document.getElementById("modalTitle").innerHTML = title;
    document.getElementById("modalBody").innerHTML = body;
    modalBackdrop.classList.add("open");
  }
  function closeModal(){ modalBackdrop.classList.remove("open"); }
  document.getElementById("modalClose").addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", function(e){ if(e.target===modalBackdrop) closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeModal(); });

  document.getElementById("nav").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-nav]"); if(!btn) return;
    state.nav = btn.getAttribute("data-nav"); render();
  });
  animalPick.addEventListener("change", function(){ state.animal = animalPick.value; render(); });
  document.getElementById("content").addEventListener("click", function(e){
    var ib = e.target.closest(".info-btn");
    if(ib){ openModal(ib.getAttribute("data-mtitle"), ib.getAttribute("data-mbody")); return; }
    var jb = e.target.closest("[data-jump-animal]");
    if(jb){ state.animal = jb.getAttribute("data-jump-animal"); state.nav = jb.getAttribute("data-jump-nav"); render(); return; }
    var fb = e.target.closest("button[data-filter]");
    if(fb){ state.panelFilter = fb.getAttribute("data-filter"); render(); }
  });
  document.getElementById("content").addEventListener("change", function(e){
    var cb = e.target.closest("input[data-series]");
    if(cb){ state.showSeries[cb.getAttribute("data-series")] = cb.checked; render(); return; }
    var ausCb = e.target.closest("input[data-aus]");
    if(ausCb){ state.showAus = ausCb.checked; render(); }
  });

  render();
})();
</script>

</body></html>
