<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: SaaS shell. Fixed left sidebar (workspace, population home, six gated cascade modules, reports); top bar with search, active record and capture action; content area of cards, charts and data grids. */
:root{
  --bg:#EEF1F2; --side:#0F2A30; --side-ink:#C9DADD; --side-ink2:#7FA0A6; --side-hi:#18414A;
  --panel:#FFFFFF; --panel2:#F5F7F7; --ink:#14222A; --ink2:#4F6068; --ink3:#7C8A90; --line:#DCE2E4;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --saffron:#AE6A08; --good:#2B7A4B; --warn:#A5680F; --crit:#B23838;
  --c2:#6B7FA8; --c3:#B88A3E; --c4:#7E57A6; --c5:#C0457E;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1316; --side:#08171B; --side-ink:#C2D3D6; --side-ink2:#6E8D93; --side-hi:#123239;
  --panel:#131E22; --panel2:#18252A; --ink:#E2EAEC; --ink2:#A0B0B6; --ink3:#71838A; --line:#25353C;
  --accent:#4BB5C0; --accent-ink:#04181B; --saffron:#E3A33F; --good:#56BA7F; --warn:#E1A647; --crit:#E56C6C;
  --c2:#8FA2CC; --c3:#D3A85C; --c4:#B48AD8; --c5:#E57FAE; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1316; --side:#08171B; --side-ink:#C2D3D6; --side-ink2:#6E8D93; --side-hi:#123239;
  --panel:#131E22; --panel2:#18252A; --ink:#E2EAEC; --ink2:#A0B0B6; --ink3:#71838A; --line:#25353C;
  --accent:#4BB5C0; --accent-ink:#04181B; --saffron:#E3A33F; --good:#56BA7F; --warn:#E1A647; --crit:#E56C6C;
  --c2:#8FA2CC; --c3:#D3A85C; --c4:#B48AD8; --c5:#E57FAE; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.eyebrow{font:600 11px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}

.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.logo .m{width:38px;height:38px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.logo .m svg{display:block}
.logo b{font:800 19px var(--f-display);color:#fff;letter-spacing:-.02em}
.wm span{color:#F0B03E}
.logo small{letter-spacing:.02em}
.logo small{display:block;font-size:11px;color:var(--side-ink2)}
.ws{margin:0 12px 12px;padding:10px 12px;border-radius:8px;background:var(--side-hi);font-size:12.5px}
.ws b{display:block;color:#fff;font-weight:600}
.ws span{color:var(--side-ink2);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav .sec{font:600 10.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--side-ink2);padding:14px 10px 6px}
.ni{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;background:none;border:0;text-align:left;color:var(--side-ink);width:100%}
.ni:hover{background:var(--side-hi)}
.ni[aria-current="page"]{background:var(--side-hi);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.ni .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:600 11px var(--f-mono);border:1px solid var(--side-ink2);color:var(--side-ink2)}
.ni.done .ic{background:var(--good);border-color:var(--good);color:#fff}
.ni.ready .ic{border-color:var(--saffron);color:var(--saffron)}
.ni.lock{color:var(--side-ink2)}
.ni .st{font-size:10.5px;color:var(--side-ink2)}
.ni.ready .st{color:var(--saffron)}
.ni svg{width:14px;height:14px}
.sidefoot{margin-top:auto;padding:14px 18px;font-size:11.5px;color:var(--side-ink2);border-top:1px solid var(--side-hi)}

/* topbar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding-inline:24px;padding-block:10px;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--ink2);min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel2);min-width:200px;color:var(--ink3)}
.search input{border:0;background:none;font:inherit;color:var(--ink);outline:0;width:100%}
.chip{font:500 12px var(--f-mono);padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 15px;border-radius:8px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.avatar{width:32px;height:32px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font:600 12px var(--f-body)}

.content{padding-inline:24px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px;max-width:1500px;width:100%}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.phead h2{font-size:24px;font-weight:800}
.phead p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h3{font-size:15px;font-weight:700}
.card .sub{font-size:12px;color:var(--ink2);margin:2px 0 12px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi .k{font-size:12px;color:var(--ink2)}
.kpi .v{font:800 26px/1.15 var(--f-display);font-variant-numeric:tabular-nums;margin-top:3px}
.kpi .v small{font:600 13px var(--f-body);color:var(--ink2);margin-left:3px}
.kpi .d{font-size:11.5px;margin-top:3px;color:var(--ink2)}
.d .up{color:var(--good);font-weight:600}.d .dn{color:var(--crit);font-weight:600}
.kpi.flag{border-color:var(--crit)}

.pill{font:600 11px/1 var(--f-body);padding:5px 9px;border-radius:99px;white-space:nowrap;display:inline-block}
.pill.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.amber,.pill.watch{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.pill.red,.pill.out{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.pill.lock{background:var(--panel2);color:var(--ink3);border:1px solid var(--line)}
.pill.info{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}

.tblw{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{text-align:left;font-weight:600;font-size:11.5px;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr.me td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.prog{display:flex;gap:2px}
.prog i{width:12px;height:6px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}

/* gate */
.gate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.gate>div{padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.gate>div:last-child{border-right:0}
.gate .v{font-weight:600;font-size:13px;margin-top:2px}
@media (max-width:760px){.gate{grid-template-columns:minmax(0,1fr)}.gate>div{border-right:0;border-bottom:1px solid var(--line)}}
.locked{display:grid;place-items:center;text-align:center;padding:56px 24px;border:1px dashed var(--line);border-radius:12px;background:var(--panel);gap:10px;color:var(--ink2)}
.locked .lk{width:48px;height:48px;border-radius:99px;background:var(--panel2);display:grid;place-items:center;border:1px solid var(--line)}
.cta{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;border-radius:12px;border:1px solid var(--saffron);background:color-mix(in srgb,var(--saffron) 7%,var(--panel))}
.cta b{display:block;font-size:14px}
.cta span{font-size:12.5px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 18px;margin:0}
.kv div{min-width:0}.kv dt{font-size:11.5px;color:var(--ink3)}.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.formula{font:12px/1.55 var(--f-mono);color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;overflow-x:auto;white-space:nowrap}
.formula b{color:var(--ink);font-weight:500}
.alert{padding:10px 14px;border-radius:10px;font-size:13px;border:1px solid}
.alert.red{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 7%,var(--panel))}
.alert.amber{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--panel))}
.alert.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 7%,var(--panel))}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.stg .k{font:600 10.5px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.stg .v{font:800 20px var(--f-display);margin-top:2px;font-variant-numeric:tabular-nums}
.stg .d{font-size:11.5px;color:var(--ink2)}
.stg.on{border-color:var(--warn)}.stg.hot{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 6%,var(--panel))}.stg.calm{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.pens{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pen{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.pen.me{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pen .bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.pen .bar i{display:block;height:100%;background:var(--accent)}
.pen.hi .bar i{background:var(--warn)}
.audit{display:flex;flex-direction:column;gap:0;max-height:320px;overflow:auto}
.audit div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.audit div:last-child{border-bottom:0}
.audit .h{grid-column:2;font:11px var(--f-mono);color:var(--ink3)}
.dot{width:8px;height:8px;border-radius:99px;background:var(--accent);margin-top:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.demo-note{font-size:12px;color:var(--ink2);padding:8px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
canvas.mz{width:100%;height:auto;border-radius:10px;display:block;background:#000}

svg text{font-family:var(--f-body)}
.ax{stroke:var(--line)}.axt{fill:var(--ink3);font-size:10.5px}.lbl{fill:var(--ink2);font-size:11.5px}.lblb{fill:var(--ink);font-size:11.5px;font-weight:600}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,18,22,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);border:1px solid var(--line)}
.modal header{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.modal header h3{font-size:17px}
.modal header p{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.modal .x{border:0;background:none;font-size:20px;line-height:1;color:var(--ink3);padding:2px 6px}
.modal{min-width:0;max-width:100%}
#tbwrap{min-width:0;max-width:100%}
.modal .body{min-width:0;padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.form.four,.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.form.four,.kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.form,.form.three{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11.5px;color:var(--ink2);font-weight:500}
.fld select,.fld input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
.fld input[readonly]{background:var(--panel2);color:var(--ink2)}
.toast{position:fixed;right:20px;bottom:20px;z-index:60;background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 12px 30px -12px rgba(0,0,0,.4);max-width:360px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:10px}
  .nav .sec,.sidefoot,.ws{display:none}
  .ni{width:auto;grid-template-columns:22px auto}.ni .st{display:none}
  .search{min-width:0;flex:1}
}

/* lifecycle pipeline */

 for(let i=0;i<=4;i++){const v=max*i/4,y=T+ih-v/max*ih;s+=`<line class="ax" x1="${L}" x2="${L+iw}" y1="${y}" y2="${y}" ${i?'stroke-dasharray="2 3"':''}/><text class="axt" x="${L-8}" y="${y+3.5}" text-anchor="end">${fmt(v)}</text>`;}
 vals.forEach((v,i)=>{const x=L+i*bw+bw*.18,hh=v/max*ih;s+=`<rect x="${x}" y="${T+ih-hh}" width="${bw*.64}" height="${hh}" rx="3" fill="${color}"/>${v?`<text class="lblb" x="${x+bw*.32}" y="${T+ih-hh-5}" text-anchor="middle">${v}</text>`:''}<text class="axt" x="${x+bw*.32}" y="${h-9}" text-anchor="middle">${labels[i]}</text>`;});

function drawMuzzle(cv){const c=cv.getContext('2d'),W=cv.width,H=cv.height,R=rng(4120412);c.fillStyle='#2a2422';c.fillRect(0,0,W,H);
 const g=c.createRadialGradient(W/2,H*.48,10,W/2,H*.5,W*.55);g.addColorStop(0,'#6b5a52');g.addColorStop(1,'#2e2623');c.fillStyle=g;c.beginPath();c.ellipse(W/2,H*.5,W*.42,H*.4,0,0,7);c.fill();
 for(let i=0;i<260;i++){const a=R()*6.283,rr=Math.sqrt(R()),x=W/2+Math.cos(a)*rr*W*.38,y=H*.5+Math.sin(a)*rr*H*.35,s=2+R()*5;c.fillStyle=`rgba(${30+R()*30|0},${24+R()*20|0},${22+R()*18|0},.85)`;c.beginPath();c.ellipse(x,y,s,s*(.6+R()*.5),R()*3,0,7);c.fill();}

 c.strokeStyle='rgba(18,14,13,.8)';c.lineWidth=2;c.beginPath();c.moveTo(W/2,H*.38);c.lineTo(W/2,H*.78);c.stroke();}

  case 'depart':addEvent('Flock departed',`F-07 · 186 head → PAS-BDG-03${bulk?` · ${n} flocks`:''}`,3);S.mig=1;go('m3');saved('Departure logged.');break;

  case 'shear':addEvent('Shearing recorded',`${bulk?n+' sheep':SH.id} · 20 Sep`,4);S.shear=1;go('m4');saved('Shearing recorded.');break;
  case 'mating':addEvent('Mating recorded',`${n} ewe${n>1?'s':''} · 1 Oct`,4);S.mate=1;go('m4');saved('Mating recorded.');break;
  case 'panel':{const k=S.visits,FP=flockPanel(k);addEvent('Flock panel uploaded',`F-07 · panel ${k+1} · ${bulk?n+' sheep':SH.id+' (merged with flock)'} · ${FP.cohorts.length} cohort${FP.cohorts.length===1?'':'s'}`,5);S.visits++;S.ip=S.visits-1;if(S.visits===5)S.done=5;go('m5');saved(S.visits===5?'Flock cleared. Step 6 is open.':`Cascade run on ${NF} sheep · ${FP.inCohort} in disease cohorts.`);break;}

  case 'handover':addEvent('Handover confirmed',`${SH.id} → M-117 · match 0.93`,6);S.done=6;go('m6');saved('Sale settled. Sheep report generated.');break;}}

function detailFor(mem,di){const D=DIS[di].D,ids=Object.keys(D).map(Number),sw=ids.reduce((a,i)=>a+Math.abs(D[i]),0);

 $('#crumb').innerHTML=p==='pop'?'<b>Home</b>':p==='tpl'?'<b>Add data</b>':p==='hub'?'For Australia / <b>Exchange hub</b>':p==='xp'?'For Australia / <b>Book Eid lambs</b>':p==='bridge'?'For Australia / <b>Kashmir ⇄ Australia</b>':p==='gap'?'For Australia / <b>CSIRO comparison</b>':p==='au'?'For Australia / <b>Australia value</b>':p==='report'?'Outputs / <b>Sheep report</b>':p==='kh'?'For Australia / <b>Knowledge hub</b>':p==='fh'?`Whole flock / <b>Flock health</b>${S.visits?' / '+SUBS[S.sub]:''}`:`Step ${p.slice(1)} / <b>${MSHORT[+p.slice(1)-1]}</b>${p==='m5'&&S.visits?' / '+SUBS[S.sub]:''}`;
 if(p==='m5')S.scope='sheep';if(p==='fh')S.scope='flock';if(p!=='m5'&&p!=='fh')stopPlay();
 if(p==='pop')renderPop();else if(p==='tpl')renderTpl();else if(p==='gap')renderGap();else if(p==='bridge')renderBridge();else if(p==='xp')renderXP();else if(p==='hub')renderHub();else if(p==='au')renderAU();else if(p==='report')renderReport();else if(p==='fh')renderFH();else if(p==='kh')renderKH();
 else{const m=MODS[+p.slice(1)-1];const st=modState(m.n);$('#view').innerHTML=modHead(m)+(st==='lock'?lockedView(m):PAGES['m'+m.n](m));const mz=$('#mz');if(mz)drawMuzzle(mz);}
 const V=$('#view');
 V.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>openTpl(b.dataset.tpl,b.dataset.mode));
 V.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 V.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{S.scope=b.dataset.scope;render();});
 V.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{S.sub=+b.dataset.sub;if(b.classList.contains('more'))S.hcMode='detail';render();if(b.classList.contains('more'))window.scrollTo({top:0});});
 V.querySelectorAll('[data-hcmode]').forEach(b=>b.onclick=()=>{S.hcMode=b.dataset.hcmode;render();});
 V.querySelectorAll('[data-ip]').forEach(b=>b.onclick=()=>{S.ip=+b.dataset.ip;stopPlay();render();});
 V.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{S.lg=+b.dataset.lg;render();});
 V.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>{S.ci=+b.dataset.ci;render();});
 linkify(V);
 const ips=$('#ipSel');if(ips)ips.onchange=()=>{S.ip=+ips.value;render();};
 V.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>askMode(b.dataset.ask));
 const ss=$('#sheepSel');if(ss)ss.onchange=()=>{S.sheep=ss.value;S.scope='sheep';S.pdis=null;render();};
 V.querySelectorAll('[data-proof]').forEach(x=>x.onclick=()=>{const v=x.dataset.proof.split(':');if(v[0]==='c'){S.ci=+v[1];S.scope='flock';}else{S.pdis=+v[1];}S.sub=8;render();window.scrollTo({top:0});});
 document.querySelectorAll('[data-hidetips]').forEach(x=>x.onclick=()=>{S.hideTips=true;render();});
 const pl=$('#play');if(pl)pl.onclick=()=>{if(play){stopPlay();render();return;}S.ip=0;play=setInterval(()=>{if((S.page!=='m5'&&S.page!=='fh')||S.ip>=S.visits-1){stopPlay();render();return;}S.ip++;render();},1300);render();};
}
$('#capture').onclick=()=>go('tpl');
$('#help').onclick=openHelp;
$('#tourbtn').onclick=startTour;
$('#active').onclick=()=>go(S.done>=6?'report':'m'+Math.min(6,S.done+1));
$('#back').onclick=()=>{const p=HIST.pop();if(p)go(p,true);};
let SG=[],SGi=0;function drawSugg(){let box=$('#sugg');const q=$('#q').value.trim().toLowerCase();if(!q){box&&box.remove();return;}
 SG=allIds().filter(x=>x.id.toLowerCase().includes(q)).slice(0,8);if(!box){box=document.createElement('div');box.id='sugg';box.className='sugg';$('.search').appendChild(box);}
 box.innerHTML=SG.length?SG.map((x,i)=>`<button data-sg="${x.id}" class="${i===SGi?'on':''}"><span class="mono">${x.id}</span><span class="muted">${x.where}</span><span class="muted">Open ›</span></button>`).join(''):'<div style="padding:10px 12px;font-size:13px" class="muted">No sheep match. Try the last 4 digits, e.g. 0412.</div>';
 box.querySelectorAll('[data-sg]').forEach(b=>b.onmousedown=e=>{e.preventDefault();$('#q').value='';box.remove();openSheep(b.dataset.sg);});}
$('#q').oninput=()=>{SGi=0;drawSugg();if(S.page==='pop')renderPop();};
$('#q').onkeydown=e=>{if(e.key==='ArrowDown'){SGi=Math.min(SG.length-1,SGi+1);drawSugg();e.preventDefault();}else if(e.key==='ArrowUp'){SGi=Math.max(0,SGi-1);drawSugg();e.preventDefault();}else if(e.key==='Enter'&&SG[SGi]){const id=SG[SGi].id;$('#q').value='';$('#sugg')?.remove();openSheep(id);}else if(e.key==='Escape'){$('#q').value='';$('#sugg')?.remove();}};
$('#q').onblur=()=>setTimeout(()=>$('#sugg')?.remove(),150);

let demo=null;
function stopDemo(){clearTimeout(demo);demo=null;$('#demo').textContent='Guided demo';}
function demoStep(){const nt=nextTpl();if(!nt){stopDemo();go('report');return;}openTpl(nt[0],nt[1]);demo=setTimeout(()=>{$('#ms')?.click();demo=setTimeout(demoStep,1400);},1500);}
$('#demo').onclick=()=>{if(demo){stopDemo();return;}if(S.done===6)S=fresh();$('#demo').textContent='Stop demo';demoStep();};
render();
welcome();
</script>

</body>
